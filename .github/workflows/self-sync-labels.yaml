name: Labels

on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/self-sync-labels.yaml
    - .github/workflows/sync-labels.yaml
  workflow_dispatch:
    inputs:
      delete-extra-labels:
        default: false
        description: Delete labels outside the canonical set
        type: boolean

permissions:
  contents: read

jobs:
  labels:
    name: Labels
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/sync-labels.yaml
    with:
      delete-extra-labels: ${{ inputs.delete-extra-labels || false }}
