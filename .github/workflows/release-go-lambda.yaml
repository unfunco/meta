name: Release Go Lambda

on:
  workflow_call:
    inputs:
      aws-region:
        description: The AWS region containing the destination S3 bucket.
        required: true
        type: string
      binary-name:
        default: bootstrap
        description: The name of the executable inside the Lambda ZIP archive.
        required: false
        type: string
      build-tags:
        default: ''
        description: A comma-separated list of build tags.
        required: false
        type: string
      goarch:
        default: arm64
        description: The Lambda architecture to build for (amd64 or arm64).
        required: false
        type: string
      go-version-file:
        default: go.mod
        description: Path to the Go version file from the working directory.
        required: false
        type: string
      ldflags:
        default: -s -w
        description: Arguments to pass to the Go linker.
        required: false
        type: string
      package:
        default: .
        description: The main package to build from the working directory.
        required: false
        type: string
      s3-bucket:
        description: The name of the destination S3 bucket.
        required: true
        type: string
      s3-key:
        description: The complete S3 object key for the Lambda ZIP archive.
        required: true
        type: string
      working-directory:
        default: .
        description: The working directory for Go commands.
        required: false
        type: string
    secrets:
      AWS_ROLE_ARN:
        description: The IAM role to assume using GitHub OpenID Connect.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build and publish (${{ inputs.goarch }})
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache-dependency-path: ${{ format('{0}/go.mod', inputs.working-directory) }}
        go-version-file: ${{ format('{0}/{1}', inputs.working-directory, inputs.go-version-file) }}
    - name: Validate inputs
      env:
        BINARY_NAME: ${{ inputs.binary-name }}
        GOARCH: ${{ inputs.goarch }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_KEY: ${{ inputs.s3-key }}
      run: |
        case "$GOARCH" in
          amd64|arm64) ;;
          *)
            echo "Unsupported Lambda architecture: $GOARCH" >&2
            exit 1
            ;;
        esac

        if [[ -z "$BINARY_NAME" || "$BINARY_NAME" == -* ||
          "$BINARY_NAME" == */* || "$BINARY_NAME" == . || "$BINARY_NAME" == .. ]]; then
          echo "binary-name must be a safe file name" >&2
          exit 1
        fi
        if [[ -z "$S3_BUCKET" || -z "$S3_KEY" || "$S3_KEY" == */ ]]; then
          echo "s3-bucket and s3-key must identify an S3 object" >&2
          exit 1
        fi
    - name: Build Lambda archive
      id: build
      env:
        BINARY_NAME: ${{ inputs.binary-name }}
        BUILD_TAGS: ${{ inputs.build-tags }}
        GOARCH: ${{ inputs.goarch }}
        LDFLAGS: ${{ inputs.ldflags }}
        OUTPUT_DIRECTORY: ${{ runner.temp }}/release-go-lambda
        PACKAGE: ${{ inputs.package }}
      run: |
        mkdir -p "$OUTPUT_DIRECTORY"
        OUTPUT="$OUTPUT_DIRECTORY/$BINARY_NAME"
        BUILD_ARGUMENTS=(-trimpath -o "$OUTPUT")
        if [[ -n "$BUILD_TAGS" ]]; then
          BUILD_ARGUMENTS+=(-tags "$BUILD_TAGS")
        fi
        if [[ -n "$LDFLAGS" ]]; then
          BUILD_ARGUMENTS+=(-ldflags "$LDFLAGS")
        fi

        CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
          go build "${BUILD_ARGUMENTS[@]}" "$PACKAGE"

        ARCHIVE="$RUNNER_TEMP/$BINARY_NAME.zip"
        (cd "$OUTPUT_DIRECTORY" && zip -q "$ARCHIVE" "$BINARY_NAME")
        echo "archive-path=$ARCHIVE" >> "$GITHUB_OUTPUT"
      working-directory: ${{ inputs.working-directory }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
    - name: Upload Lambda archive
      env:
        ARCHIVE_PATH: ${{ steps.build.outputs.archive-path }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_KEY: ${{ inputs.s3-key }}
      run: aws s3 cp "$ARCHIVE_PATH" "s3://$S3_BUCKET/$S3_KEY" --only-show-errors
