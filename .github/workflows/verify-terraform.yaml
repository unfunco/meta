name: Verify Terraform

on:
  workflow_call:
    inputs:
      run-tests:
        default: false
        description: Run Terraform tests.
        required: false
        type: boolean
      terraform-version-file:
        default: ''
        description: |
          Path to the Terraform version file from the repository root;
          defaults to .terraform-version in the working directory.
        required: false
        type: string
      working-directory:
        default: .
        description: The working directory for Terraform commands.
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Determine Terraform version
      id: terraform-version
      env:
        TERRAFORM_VERSION_FILE: ${{ inputs.terraform-version-file || format('{0}/.terraform-version', inputs.working-directory) }}
      run: |
        if [ ! -f "$TERRAFORM_VERSION_FILE" ]; then
          >&2 echo "Terraform version file not found: $TERRAFORM_VERSION_FILE"
          exit 1
        fi
        VERSION_LINES=()
        while IFS= read -r LINE || [ -n "$LINE" ]; do
          VERSION_LINES+=("$LINE")
        done < "$TERRAFORM_VERSION_FILE"
        if [[ ${#VERSION_LINES[@]} -ne 1 || -z ${VERSION_LINES[0]} || ${VERSION_LINES[0]} == *$'\r'* ]]; then
          >&2 echo "Terraform version file must contain exactly one non-empty line: $TERRAFORM_VERSION_FILE"
          exit 1
        fi
        TERRAFORM_VERSION=${VERSION_LINES[0]}
        echo "Terraform version: $TERRAFORM_VERSION"
        echo "version=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4.0.1
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
    - name: Check formatting
      run: terraform fmt -check -recursive
      working-directory: ${{ inputs.working-directory }}
    - name: Initialise with no backend
      run: terraform init -backend=false -input=false
      working-directory: ${{ inputs.working-directory }}
    - name: Validate configuration
      run: terraform validate
      working-directory: ${{ inputs.working-directory }}
    - name: Run tests
      if: ${{ inputs.run-tests }}
      run: terraform test
      working-directory: ${{ inputs.working-directory }}
