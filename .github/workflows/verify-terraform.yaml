name: Verify Terraform

on:
  workflow_call:
    inputs:
      terraform-version-file:
        description: Path to the file containing the Terraform version.
        required: true
        type: string
      working-directory:
        default: .
        description: The working directory for Terraform commands.
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    steps:
    - name: Determine Terraform version
      id: terraform-version
      run: |
        if [ ! -f "${{ inputs.terraform-version-file }}" ]; then
          >&2 echo "Terraform version file not found: ${{ inputs.terraform-version-file }}"
          exit 1
        fi
        TERRAFORM_VERSION=$(cat "${{ inputs.terraform-version-file }}")
        echo "Terraform version: $TERRAFORM_VERSION"
        echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
    - name: Check formatting
      run: terraform fmt -check -recursive
      working-directory: ${{ inputs.working-directory }}
    - name: Initialise with no backend
      run: terraform init -backend=false -input=false
      working-directory: ${{ inputs.working-directory }}
    - name: Validate configuration
      run: terraform validate
      working-directory: ${{ inputs.working-directory }}
