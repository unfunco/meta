name: Build Go Lambda

on:
  workflow_call:
    inputs:
      artifact-name:
        default: lambda
        description: The name of the GitHub Actions artifact containing bootstrap.zip.
        required: false
        type: string
      build-tags:
        default: ''
        description: A comma-separated list of build tags.
        required: false
        type: string
      goarch:
        default: arm64
        description: The Lambda architecture to build for (amd64 or arm64).
        required: false
        type: string
      go-version-file:
        default: go.mod
        description: Path to the Go version file from the working directory.
        required: false
        type: string
      ldflags:
        default: -s -w
        description: Arguments to pass to the Go linker.
        required: false
        type: string
      package:
        default: .
        description: The main package to build from the working directory.
        required: false
        type: string
      ref:
        default: ''
        description: The Git ref to build; defaults to the triggering commit.
        required: false
        type: string
      retention-days:
        default: 7
        description: The number of days to retain the Lambda artifact.
        required: false
        type: number
      working-directory:
        default: .
        description: The working directory for Go commands.
        required: false
        type: string
    outputs:
      artifact-name:
        description: The name of the uploaded GitHub Actions artifact.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref }}
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache-dependency-path: ${{ format('{0}/go.mod', inputs.working-directory) }}
        go-version-file: ${{ format('{0}/{1}', inputs.working-directory, inputs.go-version-file) }}
    - name: Validate architecture
      env:
        GOARCH: ${{ inputs.goarch }}
      run: |
        case "$GOARCH" in
          amd64|arm64) ;;
          *)
            echo "Unsupported Lambda architecture: $GOARCH" >&2
            exit 1
            ;;
        esac
    - name: Build Lambda archive
      env:
        BUILD_TAGS: ${{ inputs.build-tags }}
        GOARCH: ${{ inputs.goarch }}
        LDFLAGS: ${{ inputs.ldflags }}
        OUTPUT_DIRECTORY: ${{ runner.temp }}/build-go-lambda
        PACKAGE: ${{ inputs.package }}
      run: |
        mkdir -p "$OUTPUT_DIRECTORY"
        BUILD_ARGUMENTS=(-trimpath -o "$OUTPUT_DIRECTORY/bootstrap")
        if [[ -n "$BUILD_TAGS" ]]; then
          BUILD_ARGUMENTS+=(-tags "$BUILD_TAGS")
        fi
        if [[ -n "$LDFLAGS" ]]; then
          BUILD_ARGUMENTS+=(-ldflags "$LDFLAGS")
        fi

        CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
          go build "${BUILD_ARGUMENTS[@]}" "$PACKAGE"

        (cd "$OUTPUT_DIRECTORY" && zip -q "$RUNNER_TEMP/bootstrap.zip" bootstrap)
      working-directory: ${{ inputs.working-directory }}
    - name: Upload Lambda archive
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        if-no-files-found: error
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/bootstrap.zip
        retention-days: ${{ inputs.retention-days }}
