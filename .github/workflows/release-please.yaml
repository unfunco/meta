name: Release Please

on:
  workflow_call:
    outputs:
      release-created:
        description: Whether Release Please created a release.
        value: ${{ jobs.release.outputs.release-created }}
      tag-name:
        description: The tag name created by Release Please.
        value: ${{ jobs.release.outputs.tag-name }}
      version:
        description: The version released by Release Please.
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    name: Release
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Release?
      id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        config-file: .github/release-please-config.json
        manifest-file: .github/release-please-manifest.json
